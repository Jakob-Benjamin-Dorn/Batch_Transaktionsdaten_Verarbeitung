name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.8

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Airflow image
        run: docker compose build

      - name: Check direct dependencies
        run: |
          docker compose run --rm \
            --entrypoint python \
            airflow \
            -c '
          import jinja2
          import numpy
          import openai
          import pandas
          import psycopg2
          import pydantic
          import pyspark

          print("All direct dependencies imported successfully.")
          '

      - name: Run automated tests
        run: |
          docker compose run --rm \
            --entrypoint python \
            airflow \
            -m unittest discover \
            -s /opt/airflow/tests \
            -p "test_*.py" \
            -v

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans