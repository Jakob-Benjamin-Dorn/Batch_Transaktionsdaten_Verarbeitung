x-airflow-common: &airflow-common
  image: batch-transactions-pipeline:dev
  build:
    context: .
    dockerfile: Dockerfile

services:
  # Temporärer Initialisierungs-Container der als Root Verzeichnisse erstellt und Rechte setzt
  airflow-init:
    <<: *airflow-common

    user: "0:0"
    entrypoint: /bin/bash

    command:
      - -c
      - |
        set -e

        mkdir -p \
          /opt/airflow/data/bronze_raw \
          /opt/airflow/data/silver_processed \
          /opt/airflow/data/quarantine \
          /opt/airflow/data/gold_analytics \
          /opt/airflow/data/reports \
          /opt/airflow/state \
          /opt/airflow/logs

        chown -R 50000:0 \
          /opt/airflow/data \
          /opt/airflow/state \
          /opt/airflow/logs

        chmod -R u+rwX,g+rwX \
          /opt/airflow/data \
          /opt/airflow/state \
          /opt/airflow/logs

        echo "Docker volumes initialized."

    volumes:
      - airflow_data:/opt/airflow/data
      - airflow_state:/opt/airflow/state
      - airflow_logs:/opt/airflow/logs

    restart: "no"

# Dauerhaft laufender Container mit UID 50000 zur Ausführung von API-Servern, Schedulern und DAG-Prozessor
  airflow:
    <<: *airflow-common

    user: "50000:0"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    environment:
      AIRFLOW_HOME: /opt/airflow

      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs

      # Zugang zu Airflow über Simple Auth Manager ab Airflow 3
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/simple_auth_manager_passwords.json

      PYTHONPATH: /opt/airflow
      HOME: /home/airflow

      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"

    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./knowledge_base:/opt/airflow/knowledge_base:ro
      - ./tests:/opt/airflow/tests:ro

      - airflow_data:/opt/airflow/data
      - airflow_state:/opt/airflow/state
      - airflow_logs:/opt/airflow/logs

    command:
      - bash
      - -c
      - |
        set -e

        airflow db migrate

        airflow api-server --port 8080 &
        airflow dag-processor &

        exec airflow scheduler

volumes:
  airflow_data:
  airflow_state:
  airflow_logs: