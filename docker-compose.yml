services:
  airflow-init:
    image: batch_transaktionsdaten_verarbeitung-airflow:latest

    build:
      context: .
      dockerfile: Dockerfile

    user: "0:0"

    entrypoint: /bin/bash

    command:
      - -c
      - |
        set -e

        mkdir -p \
          /opt/airflow/state \
          /opt/airflow/logs \
          /opt/airflow/data/bronze_raw \
          /opt/airflow/data/silver_processed \
          /opt/airflow/data/quarantine \
          /opt/airflow/data/gold_analytics \
          /opt/airflow/data/reports

        chown -R 50000:0 \
          /opt/airflow/state \
          /opt/airflow/logs \
          /opt/airflow/data

        chmod -R g+rwX \
          /opt/airflow/state \
          /opt/airflow/logs \
          /opt/airflow/data

        echo "Volumes initialized."

    volumes:
      - airflow_state:/opt/airflow/state
      - airflow_logs:/opt/airflow/logs
      - airflow_data:/opt/airflow/data

    restart: "no"

    network_mode: "none"

  airflow:
    image: batch_transaktionsdaten_verarbeitung-airflow:latest

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW_HOME: /opt/airflow

      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        sqlite:////opt/airflow/state/airflow.db

      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs

      PYTHONPATH: /opt/airflow

    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./knowledge_base:/opt/airflow/knowledge_base:ro

      - airflow_data:/opt/airflow/data
      - airflow_state:/opt/airflow/state
      - airflow_logs:/opt/airflow/logs

    ports:
      - "8080:8080"

    command:
      - bash
      - -c
      - |
          set -e

          airflow db migrate

          airflow api-server --port 8080 &
          airflow dag-processor &

          exec airflow scheduler

volumes:
  airflow_data:
  airflow_state:
  airflow_logs: